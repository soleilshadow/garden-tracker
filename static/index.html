      cursor: pointer;
      margin-bottom: 14px;
    }
    .photo-picker-hero input[type="file"] {

      width: 100%; height: 100%; cursor: pointer;

  // ── Helpers ───────────────────────────────────────────────────
  function toBase64(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result.split(",")[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  }

  async function callClaude(messages, system) {
    const res = await fetch("/api/claude", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1000, system, messages })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return data.content?.map(b => b.text || "").join("") || "";
  }

  const statusOf = (p, t) => {
    const now = Date.now();
    const wDue = p.lastWatered    ? p.lastWatered    + p.waterFreqDays * 864e5 : now - 1;
    const fDue = p.lastFertilized ? p.lastFertilized + p.fertFreqDays  * 864e5 : now + 1e10;
    if (wDue < now) return { label: t.needsWater, color: "#E24B4A" };
    if (fDue < now) return { label: t.needsFert,  color: "#EF9F27" };
    return { label: t.healthy, color: "#1D9E75" };
  };

  const daysUntil = (last, freq) => {
    if (!last) return -freq;
    return Math.ceil((last + freq * 864e5 - Date.now()) / 864e5);
  };

  const fmtDate = (ts, lang) => {
    if (!ts) return "—";
    const d = Math.floor((Date.now() - ts) / 864e5);
    if (d === 0) return lang === "zh" ? "今天" : "Today";
    return lang === "zh" ? `${d}天前` : `${d}d ago`;
  };

  const fmtFull = (ts, lang) =>
    new Date(ts).toLocaleDateString(lang === "zh" ? "zh-CN" : "en-GB",
      { day: "numeric", month: "short", year: "numeric" });

  // ── PhotoButton — iOS Safari safe ─────────────────────────────
  // Renders a visible styled label with an overlaid transparent file input.
  // Works on iOS Safari over HTTPS without needing useRef click triggers.
  function PhotoButton({ label, onPhoto, style = {}, children }) {
    const handleChange = async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      const b64 = await toBase64(f);
      onPhoto(b64, f.type);
      e.target.value = ""; // reset so same file can be re-selected
    };
    return (
      <div className="photo-btn-wrap" style={style}>
        <div style={{ pointerEvents: "none", width: "100%", textAlign: "center" }}>
          {children || label}
        </div>
        <input type="file" accept="image/*" capture="environment" onChange={handleChange} />
      </div>
    );
  }

  // ── App ───────────────────────────────────────────────────────
  function App() {
    const [lang, setLang]             = useState("en");
    const t = T[lang];
    const [session, setSession]       = useState(null);
    const [profile, setProfile]       = useState(null);
    const [plants, setPlants]         = useState([]);
    const [allUsers, setAllUsers]     = useState([]);
    const [loading, setLoading]       = useState(true);
    const [view, setView]             = useState("dashboard");
    const [selectedId, setSelectedId] = useState(null);
    const [showAdd, setShowAdd]       = useState(false);
    const [showDoctor, setShowDoctor] = useState(false);
    const [showAdmin, setShowAdmin]   = useState(false);

    useEffect(() => {
      supa.auth.getSession().then(({ data: { session } }) => setSession(session));
      const { data: { subscription } } = supa.auth.onAuthStateChange((_e, s) => setSession(s));
      return () => subscription.unsubscribe();
    }, []);

    useEffect(() => {
      if (!session) { setLoading(false); setPlants([]); setProfile(null); return; }
      setLoading(true);
      loadProfile();
    }, [session]);

    const loadProfile = async () => {
      const { data } = await supa.from("profiles").select("*").eq("id", session.user.id).single();
      if (data && session.user.email === ADMIN_EMAIL && data.role !== "admin") {
        await supa.from("profiles").update({ role: "admin" }).eq("id", session.user.id);
        data.role = "admin";
      }
      setProfile(data);
      if (data?.role === "admin") {
        const { data: users } = await supa.from("profiles").select("*").order("created_at");
        setAllUsers(users || []);
      }
      loadPlants(data);
    };

    const loadPlants = async (prof) => {
      const p = prof || profile;
      let q = supa.from("plants").select("*").order("id");
      if (p?.role !== "admin") q = q.eq("user_id", session.user.id);
      const { data } = await q;
      setPlants((data || []).map(r => ({ ...r.data, _rowId: r.id, _userId: r.user_id })));
      setLoading(false);
    };

    const savePlant = async (plant) => {
      const { _rowId, _userId, ...data } = plant;
      if (_rowId) {
        await supa.from("plants").update({ data, updated_at: new Date().toISOString() }).eq("id", _rowId);
        return plant;
      } else {
        const { data: row } = await supa.from("plants").insert({ user_id: session.user.id, data }).select().single();
        return { ...plant, _rowId: row.id, _userId: row.user_id };
      }
    };

    const up = async (newPlants) => {
      setPlants(newPlants);
      for (const p of newPlants) {
        const orig = plants.find(o => o.id === p.id);
        if (JSON.stringify(orig) !== JSON.stringify(p)) await savePlant(p);
      }
    };

    const addPlant = async (plant) => {
      const saved = await savePlant(plant);
      setPlants(prev => [...prev, saved]);
    };

    const deletePlant = async (id) => {
      const plant = plants.find(p => p.id === id);
      if (plant?._rowId) await supa.from("plants").delete().eq("id", plant._rowId);
      setPlants(prev => prev.filter(p => p.id !== id));
      setView("plants"); setSelectedId(null);
    };

    const logCare = (id, type) => {
      const now = Date.now();
      const label = type === "water" ? T[lang].watered : T[lang].fertilized;
      const newPlants = plants.map(p => {
        if (p.id !== id) return p;
        const jEntry = { id: now, ts: now, note: label, photo: null, photoType: null, source: "care-log" };
        return { ...p, [type==="water"?"lastWatered":"lastFertilized"]: now, log: [...(p.log||[]), {type,ts:now}], journal: [...(p.journal||[]), jEntry] };
      });
      up(newPlants);
    };

    const selected = plants.find(p => p.id === selectedId);

    if (!session) return <AuthScreen t={t} lang={lang} />;

    return (
      <div style={{ background: "#f5f5f7", minHeight: "100vh" }}>
        {/* Header */}
        <div style={{ background: "#fff", borderBottom: "0.5px solid #e5e5ea", padding: "12px 16px", paddingTop: "max(12px,env(safe-area-inset-top))", display: "flex", alignItems: "center", justifyContent: "space-between", position: "sticky", top: 0, zIndex: 20 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 22V12M12 12C12 12 7 9 5 5C9 3 12 6 12 6M12 12C12 12 17 9 19 5C15 3 12 6 12 6" stroke="#1D9E75" strokeWidth="2" strokeLinecap="round"/></svg>
            <span style={{ fontWeight: 600, fontSize: 15 }}>{t.appName}</span>
            {profile?.role==="admin" && <span style={{ fontSize: 10, background: "#1D9E75", color: "#fff", borderRadius: 4, padding: "2px 6px" }}>Admin</span>}
          </div>
          <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
            <button onClick={()=>setLang(l=>l==="en"?"zh":"en")} style={{ fontSize: 11, padding: "5px 8px", borderRadius: 6, border: "0.5px solid #d1d1d6", background: "#f2f2f7", cursor: "pointer", color: "#6e6e73" }}>{t.lang}</button>
            <button onClick={()=>setShowDoctor(true)} style={{ fontSize: 11, padding: "5px 8px", borderRadius: 6, border: "0.5px solid #d1d1d6", background: "#f2f2f7", cursor: "pointer" }}>{t.aiDoctor}</button>
            {profile?.role==="admin" && <button onClick={()=>setShowAdmin(true)} style={{ fontSize: 11, padding: "5px 8px", borderRadius: 6, border: "0.5px solid #d1d1d6", background: "#f2f2f7", cursor: "pointer" }}>👥</button>}
            <button onClick={()=>setShowAdd(true)} style={{ fontSize: 12, padding: "6px 12px", borderRadius: 8, border: "none", background: "#1D9E75", color: "#fff", cursor: "pointer", fontWeight: 500 }}>{t.addPlant}</button>
          </div>
        </div>

        {/* Nav */}
        <div style={{ background: "#fff", borderBottom: "0.5px solid #e5e5ea", display: "flex", padding: "0 16px" }}>
          {["dashboard","plants"].map(v => (
            <button key={v} onClick={()=>{setView(v);setSelectedId(null);}} style={{ padding: "10px 14px", fontSize: 13, border: "none", background: "none", cursor: "pointer", borderBottom: view===v&&!selectedId?"2px solid #1D9E75":"2px solid transparent", color: view===v&&!selectedId?"#1D9E75":"#6e6e73", fontWeight: view===v&&!selectedId?500:400 }}>
              {v==="dashboard"?t.dashboard:t.myPlants}
            </button>
          ))}
          {selected && <button onClick={()=>setView("plant")} style={{ padding: "10px 14px", fontSize: 13, border: "none", background: "none", cursor: "pointer", borderBottom: view==="plant"?"2px solid #1D9E75":"2px solid transparent", color: view==="plant"?"#1D9E75":"#6e6e73", fontWeight: view==="plant"?500:400, maxWidth: 110, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{selected.name}</button>}
          <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 6, padding: "0 4px" }}>
            <span style={{ fontSize: 11, color: "#6e6e73", maxWidth: 70, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{profile?.username || session.user.email?.split("@")[0]}</span>
            <button onClick={()=>supa.auth.signOut()} style={{ fontSize: 11, padding: "4px 8px", borderRadius: 6, border: "0.5px solid #d1d1d6", background: "none", cursor: "pointer", color: "#6e6e73" }}>{t.signOut}</button>
          </div>
        </div>

        {/* Content */}
        <div style={{ padding: "14px", maxWidth: 680, margin: "0 auto", paddingBottom: "max(80px,env(safe-area-inset-bottom))" }}>
          {loading
            ? <div style={{ textAlign: "center", padding: 40, color: "#6e6e73", fontSize: 14 }}>{t.loading}</div>
            : <>
                {view==="dashboard" && <Dashboard plants={plants} t={t} lang={lang} onSelect={id=>{setSelectedId(id);setView("plant");}} onLog={logCare} isAdmin={profile?.role==="admin"} allUsers={allUsers} />}
                {view==="plants"    && <PlantList  plants={plants} t={t} lang={lang} onSelect={id=>{setSelectedId(id);setView("plant");}} isAdmin={profile?.role==="admin"} allUsers={allUsers} />}
                {view==="plant"&&selected && <PlantProfile plant={selected} t={t} lang={lang} onUpdate={u=>up(plants.map(p=>p.id===u.id?u:p))} onLog={logCare} onDelete={deletePlant} />}
              </>
          }
        </div>

        {showAdd    && <AddPlantModal t={t} lang={lang} onClose={()=>setShowAdd(false)} onSave={p=>{addPlant(p);setShowAdd(false);}} />}
        {showDoctor && <AIDoctor plants={plants} t={t} lang={lang} onClose={()=>setShowDoctor(false)} onUpdatePlant={u=>up(plants.map(p=>p.id===u.id?u:p))} />}
        {showAdmin  && <AdminPanel t={t} allUsers={allUsers} onClose={()=>setShowAdmin(false)} onRefresh={async()=>{ const {data}=await supa.from("profiles").select("*").order("created_at"); setAllUsers(data||[]); }} />}
      </div>
    );
  }

  // ── Admin Panel ───────────────────────────────────────────────
  function AdminPanel({ t, allUsers, onClose, onRefresh }) {
    const [updating, setUpdating] = useState(null);
    const toggleRole = async (user) => {
      setUpdating(user.id);
      await supa.from("profiles").update({ role: user.role==="admin"?"member":"admin" }).eq("id", user.id);
      await onRefresh(); setUpdating(null);
    };
    return (
      <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.55)", zIndex: 50, display: "flex", alignItems: "flex-end" }} onClick={onClose}>
        <div onClick={e=>e.stopPropagation()} style={{ background: "#fff", width: "100%", borderRadius: "16px 16px 0 0", padding: "20px 16px 30px", maxHeight: "70vh", overflowY: "auto", maxWidth: 680, margin: "0 auto" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
            <span style={{ fontWeight: 600, fontSize: 16 }}>👥 {t.adminPanel}</span>
            <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 20, color: "#6e6e73" }}>✕</button>
          </div>
          {allUsers.map(u => (
            <div key={u.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 0", borderBottom: "0.5px solid #e5e5ea" }}>
              <div style={{ width: 36, height: 36, borderRadius: "50%", background: u.role==="admin"?"#1D9E75":"#E6F1FB", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, color: u.role==="admin"?"#fff":"#185FA5", fontWeight: 600 }}>
                {(u.username||"?")[0].toUpperCase()}
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 14, fontWeight: 500 }}>{u.username}</div>
                <div style={{ fontSize: 11, color: "#6e6e73" }}>{u.role}</div>
              </div>
              <button onClick={()=>toggleRole(u)} disabled={updating===u.id} style={{ fontSize: 12, padding: "6px 12px", borderRadius: 8, border: "0.5px solid #d1d1d6", background: u.role==="admin"?"#FFF0F0":"#E1F5EE", color: u.role==="admin"?"#D85A30":"#0F6E56", cursor: "pointer" }}>
                {updating===u.id?"...":u.role==="admin"?"→ Member":"→ Admin"}
              </button>
            </div>
          ))}
        </div>
      </div>
    );
  }

  // ── Dashboard ─────────────────────────────────────────────────
  function Dashboard({ plants, t, lang, onSelect, onLog, isAdmin, allUsers }) {
    const attention = plants.filter(p => daysUntil(p.lastWatered,p.waterFreqDays)<1 || daysUntil(p.lastFertilized,p.fertFreqDays)<1);
    const uname = uid => allUsers.find(u=>u.id===uid)?.username||"";
    return (
      <div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 10, marginBottom: 14 }}>
          {[
            { label:t.myPlants,   val:plants.length, color:"#1D9E75" },
            { label:t.needsWater, val:plants.filter(p=>daysUntil(p.lastWatered,p.waterFreqDays)<1).length, color:"#E24B4A" },
            { label:t.needsFert,  val:plants.filter(p=>daysUntil(p.lastFertilized,p.fertFreqDays)<1).length, color:"#EF9F27" },
          ].map(s=>(
            <div key={s.label} style={{ background:"#fff", borderRadius:12, padding:"12px 10px", border:"0.5px solid #e5e5ea", textAlign:"center" }}>
              <div style={{ fontSize:10, color:"#6e6e73", marginBottom:4 }}>{s.label}</div>
              <div style={{ fontSize:28, fontWeight:700, color:s.color }}>{s.val}</div>
            </div>
          ))}
        </div>

        {attention.length>0 && (
          <div style={{ marginBottom:14 }}>
            <div style={{ fontSize:12, fontWeight:500, color:"#6e6e73", marginBottom:8 }}>{t.overdueTitle}</div>
            {attention.map(p=>{
              const st=statusOf(p,t),wD=daysUntil(p.lastWatered,p.waterFreqDays),fD=daysUntil(p.lastFertilized,p.fertFreqDays);
              return (
                <div key={p.id} style={{ background:"#fff", border:"0.5px solid #e5e5ea", borderLeft:`3px solid ${st.color}`, borderRadius:10, padding:"10px 12px", marginBottom:8, display:"flex", alignItems:"center", gap:10 }}>
                  <div onClick={()=>onSelect(p.id)} style={{ cursor:"pointer", flexShrink:0 }}>
                    {p.photo?<img src={`data:${p.photoType};base64,${p.photo}`} style={{ width:44,height:44,borderRadius:8,objectFit:"cover" }}/>:<div style={{ width:44,height:44,borderRadius:8,background:"#E1F5EE",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20 }}>🌱</div>}
                  </div>
                  <div onClick={()=>onSelect(p.id)} style={{ flex:1, cursor:"pointer", minWidth:0 }}>
                    <div style={{ fontWeight:500,fontSize:14,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{p.name}</div>
                    <div style={{ fontSize:11,color:st.color }}>{st.label}</div>
                    {isAdmin&&p._userId&&<div style={{ fontSize:10,color:"#6e6e73" }}>👤 {uname(p._userId)}</div>}
                  </div>
                  <div style={{ display:"flex",flexDirection:"column",gap:5,flexShrink:0 }}>
                    {wD<1&&<button onClick={()=>onLog(p.id,"water")} style={{ fontSize:11,padding:"5px 8px",borderRadius:6,border:"0.5px solid #85B7EB",background:"#E6F1FB",color:"#185FA5",cursor:"pointer" }}>💧</button>}
                    {fD<1&&<button onClick={()=>onLog(p.id,"fert")}  style={{ fontSize:11,padding:"5px 8px",borderRadius:6,border:"0.5px solid #FAC775",background:"#FAEEDA",color:"#854F0B",cursor:"pointer" }}>🌿</button>}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {attention.length===0&&plants.length>0&&<div style={{ background:"#E1F5EE",borderRadius:10,padding:"10px 14px",marginBottom:14,fontSize:13,color:"#0F6E56" }}>✓ {t.allGood}</div>}
        {plants.length===0&&<div style={{ textAlign:"center",padding:"40px 20px",color:"#6e6e73",fontSize:14 }}>{t.noPlants}</div>}

        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))", gap:10 }}>
          {plants.map(p=>{
            const st=statusOf(p,t);
            return (
              <div key={p.id} onClick={()=>onSelect(p.id)} style={{ background:"#fff",border:"0.5px solid #e5e5ea",borderRadius:12,overflow:"hidden",cursor:"pointer" }}>
                {p.photo?<img src={`data:${p.photoType};base64,${p.photo}`} style={{ width:"100%",height:100,objectFit:"cover" }}/>:<div style={{ height:100,background:"#E1F5EE",display:"flex",alignItems:"center",justifyContent:"center",fontSize:36 }}>🌱</div>}
                <div style={{ padding:"8px 10px" }}>
                  <div style={{ fontWeight:500,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{p.name}</div>
                  <div style={{ fontSize:11,color:st.color,marginTop:2 }}>{st.label}</div>
                  {isAdmin&&p._userId&&<div style={{ fontSize:10,color:"#6e6e73",marginTop:2 }}>👤 {uname(p._userId)}</div>}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // ── Plant List ────────────────────────────────────────────────
  function PlantList({ plants, t, lang, onSelect, isAdmin, allUsers }) {
    const uname = uid => allUsers.find(u=>u.id===uid)?.username||"";
    return (
      <div>
        {plants.length===0&&<div style={{ textAlign:"center",padding:"40px 20px",color:"#6e6e73",fontSize:14 }}>{t.noPlants}</div>}
        {plants.map(p=>{
          const st=statusOf(p,t),wD=daysUntil(p.lastWatered,p.waterFreqDays),fD=daysUntil(p.lastFertilized,p.fertFreqDays);
          return (
            <div key={p.id} onClick={()=>onSelect(p.id)} style={{ background:"#fff",border:"0.5px solid #e5e5ea",borderRadius:12,padding:"12px 14px",marginBottom:10,cursor:"pointer",display:"flex",gap:12,alignItems:"center" }}>
              {p.photo?<img src={`data:${p.photoType};base64,${p.photo}`} style={{ width:54,height:54,borderRadius:10,objectFit:"cover",flexShrink:0 }}/>:<div style={{ width:54,height:54,borderRadius:10,background:"#E1F5EE",display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,flexShrink:0 }}>🌱</div>}
              <div style={{ flex:1,minWidth:0 }}>
                <div style={{ fontWeight:500,fontSize:14,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{p.name}</div>
                {p.species&&<div style={{ fontSize:12,color:"#6e6e73" }}>{p.species}</div>}
                <div style={{ fontSize:11,color:st.color,marginTop:2 }}>{st.label}</div>
                {isAdmin&&p._userId&&<div style={{ fontSize:10,color:"#6e6e73" }}>👤 {uname(p._userId)}</div>}
              </div>
              <div style={{ fontSize:11,color:"#6e6e73",textAlign:"right",flexShrink:0 }}>
                <div>💧 {wD<0?t.overdue:wD===0?t.due:`${t.inDays} ${wD}${t.days}`}</div>
                <div style={{ marginTop:3 }}>🌿 {fD<0?t.overdue:fD===0?t.due:`${t.inDays} ${fD}${t.days}`}</div>
              </div>
            </div>
          );
        })}
      </div>
    );
  }

  // ── Plant Profile ─────────────────────────────────────────────
  function PlantProfile({ plant, t, lang, onUpdate, onLog, onDelete }) {
    const [tab,    setTab]    = useState("care");
    const [editing,setEditing]= useState(false);
    const [form,   setForm]   = useState({ name:plant.name, species:plant.species||"", location:plant.location||"", waterFreqDays:plant.waterFreqDays, fertFreqDays:plant.fertFreqDays });
    const [jNote,  setJNote]  = useState("");
    const [jPhoto, setJPhoto] = useState(null);
    const [jPT,    setJPT]    = useState(null);

    useEffect(()=>{
      setForm({ name:plant.name, species:plant.species||"", location:plant.location||"", waterFreqDays:plant.waterFreqDays, fertFreqDays:plant.fertFreqDays });
    },[plant.id]);

    const addJournal = () => {
      if (!jNote&&!jPhoto) return;
      onUpdate({...plant, journal:[...(plant.journal||[]),{ id:Date.now(),ts:Date.now(),note:jNote,photo:jPhoto,photoType:jPT }]});
      setJNote(""); setJPhoto(null); setJPT(null);
    };
    const saveEdit = () => { onUpdate({...plant,...form,waterFreqDays:Number(form.waterFreqDays),fertFreqDays:Number(form.fertFreqDays)}); setEditing(false); };
    const wD=daysUntil(plant.lastWatered,plant.waterFreqDays),fD=daysUntil(plant.lastFertilized,plant.fertFreqDays),st=statusOf(plant,t);

    return (
      <div>
        {/* Hero */}
        <div style={{ background:"#fff",border:"0.5px solid #e5e5ea",borderRadius:14,overflow:"hidden",marginBottom:12 }}>
          <div style={{ position:"relative" }}>
            {plant.photo?<img src={`data:${plant.photoType};base64,${plant.photo}`} style={{ width:"100%",height:200,objectFit:"cover" }}/>:<div style={{ height:200,background:"#E1F5EE",display:"flex",alignItems:"center",justifyContent:"center",fontSize:64 }}>🌱</div>}
            {/* iOS-safe photo change button */}
            <div style={{ position:"absolute",bottom:10,right:10 }}>
              <PhotoButton
                onPhoto={(b64,type)=>onUpdate({...plant,photo:b64,photoType:type})}
                style={{ padding:"6px 12px",borderRadius:8,background:"rgba(0,0,0,0.5)",color:"#fff",fontSize:12,fontWeight:500 }}
              >{t.changePhoto}</PhotoButton>
            </div>
          </div>

          <div style={{ padding:"14px" }}>
            {editing ? (
              <div style={{ display:"flex",flexDirection:"column",gap:10 }}>
                {[["name",t.plantName],["species",t.species],["location",t.location]].map(([k,lbl])=>(
                  <div key={k}>
                    <div style={{ fontSize:12,color:"#6e6e73",marginBottom:4 }}>{lbl}</div>
                    <input value={form[k]} onChange={e=>setForm({...form,[k]:e.target.value})} style={{ width:"100%",padding:"10px 12px",borderRadius:8,border:"0.5px solid #d1d1d6",background:"#f2f2f7",color:"#1c1c1e",fontSize:15 }} />
                  </div>
                ))}
                <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:10 }}>
                  {[["waterFreqDays",t.waterFreq],["fertFreqDays",t.fertFreq]].map(([k,lbl])=>(
                    <div key={k}>
                      <div style={{ fontSize:12,color:"#6e6e73",marginBottom:4 }}>{lbl}</div>
                      <input type="number" value={form[k]} onChange={e=>setForm({...form,[k]:e.target.value})} style={{ width:"100%",padding:"10px 12px",borderRadius:8,border:"0.5px solid #d1d1d6",background:"#f2f2f7",color:"#1c1c1e",fontSize:15 }} />
                    </div>
                  ))}
                </div>
                <div style={{ display:"flex",gap:8 }}>
                  <button onClick={saveEdit} style={{ flex:1,padding:"10px",borderRadius:10,border:"none",background:"#1D9E75",color:"#fff",cursor:"pointer",fontSize:14,fontWeight:500 }}>{t.saveChanges}</button>
                  <button onClick={()=>setEditing(false)} style={{ flex:1,padding:"10px",borderRadius:10,border:"0.5px solid #d1d1d6",background:"none",cursor:"pointer",fontSize:14 }}>{t.cancel}</button>
                </div>
              </div>
            ) : (
              <div>
                <div style={{ display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12 }}>
                  <div>
                    <div style={{ fontWeight:700,fontSize:20 }}>{plant.name}</div>
                    {plant.species&&<div style={{ fontSize:13,color:"#6e6e73",marginTop:2 }}>{plant.species}</div>}
                    {plant.location&&<div style={{ fontSize:12,color:"#6e6e73",marginTop:2 }}>📍 {plant.location}</div>}
                  </div>
                  <button onClick={()=>setEditing(true)} style={{ fontSize:12,padding:"6px 12px",borderRadius:8,border:"0.5px solid #d1d1d6",background:"none",cursor:"pointer",color:"#6e6e73",flexShrink:0 }}>{t.editDetails}</button>
                </div>
                <div style={{ display:"flex",gap:8,marginBottom:12 }}>
                  <div style={{ flex:1,background:"#E6F1FB",borderRadius:10,padding:"10px 12px" }}>
                    <div style={{ fontSize:11,color:"#185FA5",marginBottom:3 }}>💧 {t.water}</div>
                    <div style={{ fontSize:14,fontWeight:600,color:wD<0?"#E24B4A":"#0C447C" }}>{wD<0?t.overdue:wD===0?t.due:`${t.inDays} ${wD}${t.days}`}</div>
                    <div style={{ fontSize:11,color:"#378ADD",marginTop:2 }}>{fmtDate(plant.lastWatered,lang)}</div>
                  </div>
                  <div style={{ flex:1,background:"#FAEEDA",borderRadius:10,padding:"10px 12px" }}>
                    <div style={{ fontSize:11,color:"#854F0B",marginBottom:3 }}>🌿 {t.fertilize}</div>
                    <div style={{ fontSize:14,fontWeight:600,color:fD<0?"#E24B4A":"#633806" }}>{fD<0?t.overdue:fD===0?t.due:`${t.inDays} ${fD}${t.days}`}</div>
                    <div style={{ fontSize:11,color:"#BA7517",marginTop:2 }}>{fmtDate(plant.lastFertilized,lang)}</div>
                  </div>
                </div>
                <div style={{ display:"flex",gap:8 }}>
                  <button onClick={()=>onLog(plant.id,"water")} style={{ flex:1,padding:"11px",borderRadius:10,border:"0.5px solid #85B7EB",background:"#E6F1FB",color:"#185FA5",cursor:"pointer",fontSize:14,fontWeight:500 }}>💧 {t.water}</button>
                  <button onClick={()=>onLog(plant.id,"fert")}  style={{ flex:1,padding:"11px",borderRadius:10,border:"0.5px solid #FAC775",background:"#FAEEDA",color:"#854F0B",cursor:"pointer",fontSize:14,fontWeight:500 }}>🌿 {t.fertilize}</button>
                </div>
              </div>
            )}
          </div>
        </div>

        {/* Tabs */}
        <div style={{ display:"flex",background:"#fff",border:"0.5px solid #e5e5ea",borderRadius:"12px 12px 0 0",overflow:"hidden" }}>
          {["care","journal","log"].map(tb=>(
            <button key={tb} onClick={()=>setTab(tb)} style={{ flex:1,padding:"11px 0",fontSize:13,border:"none",background:"none",cursor:"pointer",borderBottom:tab===tb?"2px solid #1D9E75":"2px solid transparent",color:tab===tb?"#1D9E75":"#6e6e73",fontWeight:tab===tb?500:400 }}>
              {tb==="care"?t.careDetails:tb==="journal"?t.growthJournal:t.careLog}
            </button>
          ))}
        </div>

        {tab==="care" && (
          <div style={{ background:"#fff",border:"0.5px solid #e5e5ea",borderTop:"none",borderRadius:"0 0 12px 12px",padding:14 }}>
            {plant.aiNotes ? (
              <>
                {plant.aiNotes.sunlight      && <Row label={t.sunlight}  val={plant.aiNotes.sunlight} />}
                {plant.aiNotes.soil          && <Row label={t.soil}      val={plant.aiNotes.soil} />}
                {plant.aiNotes.waterFreqDays && <Row label={t.waterFreq} val={`${lang==="zh"?"每":"Every "} ${plant.aiNotes.waterFreqDays} ${lang==="zh"?"天":"days"}`} />}
                {plant.aiNotes.fertFreqDays  && <Row label={t.fertFreq}  val={`${lang==="zh"?"每":"Every "} ${plant.aiNotes.fertFreqDays} ${lang==="zh"?"天":"days"}`} />}
                {plant.aiNotes.tips          && <Row label={t.tips}      val={plant.aiNotes.tips} />}
                {plant.aiNotes.raw           && <div style={{ fontSize:13,color:"#6e6e73",marginTop:10,lineHeight:1.65 }}>{plant.aiNotes.raw}</div>}
              </>
            ) : (
              <div style={{ fontSize:13,color:"#6e6e73" }}>{t.aiNotes} — {lang==="zh"?"添加植物时AI会自动识别":"AI notes appear after photo identification"}</div>
            )}
            <button onClick={()=>{if(window.confirm(t.deletePlant+"?"))onDelete(plant.id);}} style={{ marginTop:18,width:"100%",padding:"11px",borderRadius:10,border:"0.5px solid #F0997B",background:"none",color:"#D85A30",cursor:"pointer",fontSize:14 }}>{t.deletePlant}</button>
          </div>
        )}

        {tab==="journal" && (
          <div style={{ background:"#fff",border:"0.5px solid #e5e5ea",borderTop:"none",borderRadius:"0 0 12px 12px",padding:14 }}>
            <textarea value={jNote} onChange={e=>setJNote(e.target.value)} placeholder={t.addNote} rows={2} style={{ width:"100%",padding:"10px 12px",borderRadius:8,border:"0.5px solid #d1d1d6",background:"#f2f2f7",fontSize:14,resize:"none",boxSizing:"border-box",color:"#1c1c1e" }} />
            <div style={{ display:"flex",gap:8,marginTop:8,marginBottom:14 }}>
              {/* iOS-safe journal photo button */}
              <PhotoButton
                onPhoto={(b64,type)=>{setJPhoto(b64);setJPT(type);}}
                style={{ flex:1,padding:"10px",borderRadius:8,border:"0.5px solid #d1d1d6",background:"#f2f2f7",fontSize:13,color:"#6e6e73" }}
              >{t.addJournalPhoto}</PhotoButton>
              <button onClick={addJournal} style={{ flex:1,padding:"10px",borderRadius:8,border:"none",background:"#1D9E75",color:"#fff",cursor:"pointer",fontSize:13,fontWeight:500 }}>{t.addEntry}</button>
            </div>
            {jPhoto&&<img src={`data:${jPT};base64,${jPhoto}`} style={{ width:"100%",maxHeight:140,objectFit:"cover",borderRadius:8,marginBottom:14 }}/>}
            {(plant.journal||[]).length===0&&<div style={{ textAlign:"center",color:"#6e6e73",fontSize:13,padding:"16px 0" }}>{t.noJournal}</div>}
            {(plant.journal||[]).slice().reverse().map(e=>(
              <div key={e.id} style={{ borderTop:"0.5px solid #e5e5ea",paddingTop:12,marginTop:12 }}>
                <div style={{ fontSize:11,color:"#6e6e73",marginBottom:6,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap" }}>
                  <span>{fmtFull(e.ts,lang)}</span>
                  {e.source==="care-log"  && <span style={{ background:"#E1F5EE",color:"#0F6E56",borderRadius:4,padding:"2px 6px",fontSize:10 }}>{lang==="zh"?"养护记录":"Care Log"}</span>}
                  {e.source==="ai-doctor" && <span style={{ background:"#EDE9FE",color:"#5B21B6",borderRadius:4,padding:"2px 6px",fontSize:10 }}>AI Doctor</span>}
                </div>
                {e.photo&&<img src={`data:${e.photoType};base64,${e.photo}`} style={{ width:"100%",maxHeight:180,objectFit:"cover",borderRadius:8,marginBottom:8 }}/>}
                {e.note&&<div style={{ fontSize:13,lineHeight:1.6,whiteSpace:"pre-wrap" }}>{e.note}</div>}
              </div>
            ))}
          </div>
        )}

        {tab==="log" && (
          <div style={{ background:"#fff",border:"0.5px solid #e5e5ea",borderTop:"none",borderRadius:"0 0 12px 12px",padding:14 }}>
            {(plant.log||[]).length===0&&<div style={{ textAlign:"center",color:"#6e6e73",fontSize:13,padding:"16px 0" }}>{t.noLog}</div>}
            {(plant.log||[]).slice().reverse().map((e,i)=>(
              <div key={i} style={{ display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderBottom:"0.5px solid #e5e5ea" }}>
                <span style={{ fontSize:18 }}>{e.type==="water"?"💧":"🌿"}</span>
                <span style={{ fontSize:13 }}>{e.type==="water"?t.watered:t.fertilized}</span>
                <span style={{ marginLeft:"auto",fontSize:12,color:"#6e6e73" }}>{fmtFull(e.ts,lang)}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  function Row({ label, val }) {
    return (
      <div style={{ display:"flex",gap:10,marginBottom:10,fontSize:13 }}>
        <div style={{ color:"#6e6e73",minWidth:90,flexShrink:0 }}>{label}</div>
        <div style={{ color:"#1c1c1e",flex:1,lineHeight:1.5 }}>{val}</div>
      </div>
    );
  }

  // ── Add Plant Modal ───────────────────────────────────────────
  function AddPlantModal({ t, lang, onClose, onSave }) {
    const [name,  setName]    = useState("");
    const [spec,  setSpec]    = useState("");
    const [loc,   setLoc]     = useState("");
    const [wFreq, setWFreq]   = useState(3);
    const [fFreq, setFFreq]   = useState(14);
    const [photo, setPhoto]   = useState(null);
    const [pType, setPType]   = useState(null);
    const [ident, setIdent]   = useState(false);
    const [aiNotes,setAiNotes]= useState(null);

    const identify = async () => {
      if (!photo) return; setIdent(true);
      try {
        const sys = lang==="zh"
          ? `你是一位专业的植物识别助手。分析图片并以JSON格式返回：{"name":"植物名称","species":"学名/品种","sunlight":"光照需求","soil":"土壤要求","waterFreqDays":数字,"fertFreqDays":数字,"tips":"详细养护建议","raw":"植物简介"}。仅返回JSON。`
          : `You are a plant identification expert. Return JSON only: {"name":"Common name","species":"Species","sunlight":"light needs","soil":"soil requirements","waterFreqDays":number,"fertFreqDays":number,"tips":"detailed care tips","raw":"plant description"}. No other text.`;
        const txt = await callClaude([{ role:"user", content:[
          { type:"image", source:{ type:"base64", media_type:pType, data:photo }},
          { type:"text",  text: lang==="zh"?"请识别这株植物并提供详细养护信息":"Identify this plant and provide detailed care info" }
        ]}], sys);
        const p = JSON.parse(txt.replace(/```json|```/g,"").trim());
        setName(p.name||""); setSpec(p.species||"");
        if (p.waterFreqDays) setWFreq(p.waterFreqDays);
        if (p.fertFreqDays)  setFFreq(p.fertFreqDays);
        setAiNotes({ sunlight:p.sunlight, soil:p.soil, tips:p.tips, raw:p.raw, waterFreqDays:p.waterFreqDays, fertFreqDays:p.fertFreqDays });
      } catch(e) { console.error(e); }
      setIdent(false);
    };

    const save = () => {
      if (!name.trim()) return;
      onSave({ id:Date.now(), name:name.trim(), species:spec, location:loc, waterFreqDays:Number(wFreq), fertFreqDays:Number(fFreq), photo, photoType:pType, aiNotes, log:[], journal:[] });
    };

    return (
      <div style={{ position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:50,display:"flex",alignItems:"flex-end" }} onClick={onClose}>
        <div onClick={e=>e.stopPropagation()} style={{ background:"#fff",width:"100%",borderRadius:"20px 20px 0 0",padding:"22px 16px",paddingBottom:"max(30px,env(safe-area-inset-bottom))",maxHeight:"94vh",overflowY:"auto",maxWidth:680,margin:"0 auto" }}>
          <div style={{ fontWeight:700,fontSize:18,marginBottom:18 }}>{lang==="zh"?"添加新植物":"Add New Plant"}</div>

          {/* iOS-safe full-width photo picker */}
          <div className="photo-btn-wrap photo-picker-hero" style={{ marginBottom:14 }}>
            {photo
              ? <img src={`data:${pType};base64,${photo}`} style={{ width:"100%",height:"100%",objectFit:"cover" }} />
              : <span style={{ color:"#1D9E75",fontSize:15,pointerEvents:"none" }}>{t.addPhoto}</span>
            }
            <input type="file" accept="image/*" capture="environment" onChange={async e=>{ const f=e.target.files[0]; if(!f) return; setPhoto(await toBase64(f)); setPType(f.type); e.target.value=""; }} />
          </div>

          {photo && (
            <button onClick={identify} disabled={ident} style={{ width:"100%",padding:"12px",borderRadius:12,border:"none",background:ident?"#9FE1CB":"#1D9E75",color:"#fff",cursor:ident?"default":"pointer",fontSize:14,fontWeight:500,marginBottom:14 }}>
              {ident?`⏳ ${t.identifying}`:t.aiIdentify}
            </button>
          )}

          {aiNotes && (
            <div style={{ background:"#E1F5EE",borderRadius:12,padding:"14px",marginBottom:14,fontSize:13,color:"#0F6E56",lineHeight:1.7 }}>
              <div style={{ fontWeight:600,marginBottom:8 }}>🤖 {lang==="zh"?"AI 识别结果":"AI Identification Result"}</div>
              {aiNotes.sunlight      && <div>☀️ <b>{t.sunlight}:</b> {aiNotes.sunlight}</div>}
              {aiNotes.soil          && <div>🪴 <b>{t.soil}:</b> {aiNotes.soil}</div>}
              {aiNotes.waterFreqDays && <div>💧 <b>{lang==="zh"?"浇水频率":"Water every"}:</b> {aiNotes.waterFreqDays} {lang==="zh"?"天":"days"}</div>}
              {aiNotes.fertFreqDays  && <div>🌿 <b>{lang==="zh"?"施肥频率":"Fertilize every"}:</b> {aiNotes.fertFreqDays} {lang==="zh"?"天":"days"}</div>}
              {aiNotes.tips          && <div style={{ marginTop:6 }}>💡 {aiNotes.tips}</div>}
              {aiNotes.raw           && <div style={{ marginTop:6,color:"#155E48" }}>{aiNotes.raw}</div>}
            </div>
          )}

          {[[name,setName,t.plantName],[spec,setSpec,t.species],[loc,setLoc,t.location]].map(([val,setter,lbl])=>(
            <div key={lbl} style={{ marginBottom:12 }}>
              <div style={{ fontSize:12,color:"#6e6e73",marginBottom:4 }}>{lbl}</div>
              <input value={val} onChange={e=>setter(e.target.value)} style={{ width:"100%",padding:"11px 14px",borderRadius:10,border:"0.5px solid #d1d1d6",background:"#f2f2f7",color:"#1c1c1e",fontSize:15,boxSizing:"border-box" }} />
            </div>
          ))}

          <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:20 }}>
            {[[wFreq,setWFreq,t.waterFreq],[fFreq,setFFreq,t.fertFreq]].map(([val,setter,lbl])=>(
              <div key={lbl}>
                <div style={{ fontSize:12,color:"#6e6e73",marginBottom:4 }}>{lbl}</div>
                <input type="number" min="1" value={val} onChange={e=>setter(e.target.value)} style={{ width:"100%",padding:"11px 14px",borderRadius:10,border:"0.5px solid #d1d1d6",background:"#f2f2f7",color:"#1c1c1e",fontSize:15,boxSizing:"border-box" }} />
              </div>
            ))}
          </div>

          <div style={{ display:"flex",gap:10 }}>
            <button onClick={save} disabled={!name.trim()} style={{ flex:1,padding:"13px",borderRadius:12,border:"none",background:name.trim()?"#1D9E75":"#9FE1CB",color:"#fff",cursor:name.trim()?"pointer":"default",fontSize:15,fontWeight:600 }}>{t.save}</button>
            <button onClick={onClose} style={{ flex:1,padding:"13px",borderRadius:12,border:"0.5px solid #d1d1d6",background:"none",cursor:"pointer",fontSize:15 }}>{t.cancel}</button>
          </div>
        </div>
      </div>
    );
  }

  // ── AI Doctor ─────────────────────────────────────────────────
  function AIDoctor({ plants, t, lang, onClose, onUpdatePlant }) {
    const [msgs,      setMsgs]      = useState([]);
    const [input,     setInput]     = useState("");
    const [loading,   setLoading]   = useState(false);
    const [selPlant,  setSelPlant]  = useState("");
    const [photo,     setPhoto]     = useState(null);
    const [pType,     setPType]     = useState(null);
    const [userNote,  setUserNote]  = useState("");
    const [showSave,  setShowSave]  = useState(false);
    const [lastAI,    setLastAI]    = useState("");
    const [lastPhoto, setLastPhoto] = useState(null);
    const [lastPType, setLastPType] = useState(null);
    const [saveStatus,setSaveStatus]= useState("");
    const bottomRef = useRef();

    const send = async () => {
      if ((!input.trim()&&!photo)||loading) return;
      const parts=[];
      if (photo) parts.push({ type:"image", source:{ type:"base64", media_type:pType, data:photo }});
      if (input.trim()) parts.push({ type:"text", text:input.trim() });
      const content = parts.length===1&&parts[0].type==="text" ? input.trim() : parts;
      const userMsg = { role:"user", content, _photo:photo, _pType:pType, _text:input.trim() };
      const sp=photo,spt=pType;
      setMsgs(prev=>[...prev,userMsg]); setInput(""); setPhoto(null); setPType(null); setLoading(true);
      const newMsgs=[...msgs,userMsg];

      const plant=plants.find(p=>p.id.toString()===selPlant);
      const ctx=plant?(lang==="zh"?`用户正在询问关于植物"${plant.name}"的问题。`:`User is asking about "${plant.name}".`):"";
      const sys=lang==="zh"
        ?`你是一位专业的园艺顾问，用中文回答问题。${ctx}如果有植物照片，请分析健康状况并给出详细的浇水和施肥建议。回答简洁实用。`
        :`You are a professional gardening advisor. ${ctx} If a plant photo is provided, analyse health and give specific watering and fertilizing advice. Be concise and practical.`;

      try {
        const reply=await callClaude(newMsgs.map(m=>({role:m.role,content:m.content})),sys);
        setLastAI(reply);
        setMsgs(prev=>[...prev,{role:"assistant",content:reply}]);
        if (sp) { setLastPhoto(sp); setLastPType(spt); setShowSave(true); }
      } catch {
        setMsgs(prev=>[...prev,{role:"assistant",content:lang==="zh"?"抱歉，出现错误，请重试。":"Sorry, something went wrong."}]);
      }
      setLoading(false);
      setTimeout(()=>bottomRef.current?.scrollIntoView({behavior:"smooth"}),100);
    };

    const saveToJournal = () => {
      const plant=plants.find(p=>p.id.toString()===selPlant); if(!plant) return;
      setSaveStatus("saving");
      const note=[lastAI,userNote].filter(Boolean).join("\n\n---\n");
      onUpdatePlant({...plant,journal:[...(plant.journal||[]),{id:Date.now(),ts:Date.now(),photo:lastPhoto,photoType:lastPType,note,source:"ai-doctor"}]});
      setSaveStatus("saved"); setShowSave(false); setUserNote("");
      setTimeout(()=>setSaveStatus(""),2500);
    };

    return (
      <div style={{ position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:50,display:"flex",alignItems:"flex-end" }} onClick={onClose}>
        <div onClick={e=>e.stopPropagation()} style={{ background:"#fff",width:"100%",borderRadius:"20px 20px 0 0",maxHeight:"92vh",display:"flex",flexDirection:"column",maxWidth:680,margin:"0 auto" }}>

          <div style={{ padding:"16px 16px 12px",borderBottom:"0.5px solid #e5e5ea",display:"flex",justifyContent:"space-between",alignItems:"center" }}>
            <span style={{ fontWeight:700,fontSize:16 }}>🌿 {t.aiDoctor}</span>
            <div style={{ display:"flex",alignItems:"center",gap:10 }}>
              {saveStatus==="saved"&&<span style={{ fontSize:12,color:"#1D9E75" }}>{t.savedJournal}</span>}
              <button onClick={onClose} style={{ background:"none",border:"none",cursor:"pointer",color:"#6e6e73",fontSize:22 }}>✕</button>
            </div>
          </div>

          <div style={{ padding:"10px 16px",borderBottom:"0.5px solid #e5e5ea" }}>
            <select value={selPlant} onChange={e=>setSelPlant(e.target.value)} style={{ width:"100%",padding:"10px 12px",borderRadius:10,border:"0.5px solid #d1d1d6",background:"#f2f2f7",color:"#1c1c1e",fontSize:14 }}>
              <option value="">{t.selectPlant}</option>
              {plants.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </div>

          <div style={{ flex:1,overflowY:"auto",padding:16 }}>
            {msgs.length===0&&(
              <div style={{ textAlign:"center",color:"#6e6e73",fontSize:13,paddingTop:24,lineHeight:1.8 }}>
                {lang==="zh"?"📷 点击下方相机按钮拍照\nAI会分析健康状况并给出浇水施肥建议！":"📷 Tap the camera button below to take a photo\nAI will diagnose plant health and give care advice!"}
              </div>
            )}
            {msgs.map((m,i)=>(
              <div key={i} style={{ marginBottom:12,display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start" }}>
                <div style={{ maxWidth:"82%",borderRadius:m.role==="user"?"16px 16px 4px 16px":"16px 16px 16px 4px",overflow:"hidden",background:m.role==="user"?"#1D9E75":"#f2f2f7" }}>
                  {m._photo&&<img src={`data:${m._pType};base64,${m._photo}`} style={{ width:"100%",maxHeight:200,objectFit:"cover",display:"block" }}/>}
                  {(m._text||m.role==="assistant")&&(
                    <div style={{ padding:"10px 14px",color:m.role==="user"?"#fff":"#1c1c1e",fontSize:14,lineHeight:1.6 }}>
                      {m.role==="user"?m._text:m.content}
                    </div>
                  )}
                </div>
              </div>
            ))}
            {loading&&<div style={{ display:"flex",justifyContent:"flex-start",marginBottom:12 }}><div style={{ padding:"10px 14px",borderRadius:"16px 16px 16px 4px",background:"#f2f2f7",fontSize:14,color:"#6e6e73" }}>{t.thinking}</div></div>}

            {showSave&&(
              <div style={{ background:"#E1F5EE",borderRadius:12,padding:14,marginTop:10 }}>
                <div style={{ fontSize:13,fontWeight:600,color:"#0F6E56",marginBottom:10 }}>{t.savePrompt}</div>
                {!selPlant&&<div style={{ fontSize:12,color:"#854F0B",marginBottom:8 }}>{lang==="zh"?"⚠️ 请先选择上方的植物":"⚠️ Select a plant above first"}</div>}
                <textarea value={userNote} onChange={e=>setUserNote(e.target.value)} placeholder={t.addOwnNote} rows={2} style={{ width:"100%",padding:"10px 12px",borderRadius:8,border:"0.5px solid #9FE1CB",background:"#fff",fontSize:13,resize:"none",boxSizing:"border-box",marginBottom:10 }} />
                <div style={{ display:"flex",gap:8 }}>
                  <button onClick={saveToJournal} disabled={!selPlant||saveStatus==="saving"} style={{ flex:1,padding:"10px",borderRadius:10,border:"none",background:selPlant?"#1D9E75":"#9FE1CB",color:"#fff",cursor:selPlant?"pointer":"default",fontSize:14,fontWeight:500 }}>
                    {saveStatus==="saving"?(lang==="zh"?"保存中...":"Saving..."):t.saveJournal}
                  </button>
                  <button onClick={()=>setShowSave(false)} style={{ padding:"10px 16px",borderRadius:10,border:"0.5px solid #9FE1CB",background:"none",cursor:"pointer",fontSize:13,color:"#0F6E56" }}>{t.skipSave}</button>
                </div>
              </div>
            )}
            <div ref={bottomRef} />
          </div>

          {/* Photo preview */}
          {photo&&(
            <div style={{ padding:"8px 16px 0",display:"flex",alignItems:"center",gap:10 }}>
              <img src={`data:${pType};base64,${photo}`} style={{ width:54,height:54,borderRadius:8,objectFit:"cover" }}/>
              <span style={{ fontSize:13,color:"#6e6e73",flex:1 }}>{t.photoReady}</span>
              <button onClick={()=>{setPhoto(null);setPType(null);}} style={{ fontSize:13,padding:"5px 10px",borderRadius:6,border:"0.5px solid #d1d1d6",background:"none",cursor:"pointer",color:"#E24B4A" }}>✕</button>
            </div>
          )}

          {/* Input bar with iOS-safe camera button */}
          <div style={{ padding:"12px 16px",paddingBottom:"max(20px,env(safe-area-inset-bottom))",borderTop:"0.5px solid #e5e5ea",display:"flex",gap:8,alignItems:"center" }}>
            <PhotoButton
              onPhoto={(b64,type)=>{setPhoto(b64);setPType(type);}}
              style={{ padding:"11px 13px",borderRadius:24,border:"0.5px solid #d1d1d6",background:"#f2f2f7",fontSize:18,flexShrink:0,minWidth:48 }}
            >📷</PhotoButton>
            <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&send()} placeholder={t.askAnything} style={{ flex:1,padding:"11px 16px",borderRadius:24,border:"0.5px solid #d1d1d6",background:"#f2f2f7",color:"#1c1c1e",fontSize:14,outline:"none" }} />
            <button onClick={send} disabled={loading||(!input.trim()&&!photo)} style={{ padding:"11px 18px",borderRadius:24,border:"none",background:(loading||(!input.trim()&&!photo))?"#9FE1CB":"#1D9E75",color:"#fff",cursor:(loading||(!input.trim()&&!photo))?"default":"pointer",fontSize:14,fontWeight:600,flexShrink:0 }}>{t.send}</button>
          </div>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
